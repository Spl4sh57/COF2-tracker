<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi COF2 (Partagé)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            overscroll-behavior-y: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #1a1a1a;
            color: #e5e5e5;
            padding-bottom: env(safe-area-inset-bottom);
        }
        input, select, textarea { user-select: text; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // CONFIGURATION GITHUB & FIREBASE
        // ==========================================
        const GITHUB_REPO = "spl4sh57/COF2-tracker";

        const firebaseConfig = {
            apiKey: "AIzaSyCI5jcHG5D0z0lRJk2Dya4wZQw5s-xINY0",
            authDomain: "tracker-cof2.firebaseapp.com",
            projectId: "tracker-cof2",
            storageBucket: "tracker-cof2.firebasestorage.app",
            messagingSenderId: "550291814114",
            appId: "1:550291814114:web:0a6d3e9e1646bbdf4210bb"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Fonction utilitaire pour générer un code de table à 5 caractères uniques
        const generateTableCode = () => {
            const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            let code = "";
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        };

        // --- Icônes ---
        const IconBase = ({ size = 24, color = "currentColor", strokeWidth = 2, className = "", children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );

        const Icons = {
            Shield: (p) => <IconBase {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></IconBase>,
            Zap: (p) => <IconBase {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>,
            Activity: (p) => <IconBase {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></IconBase>,
            Plus: (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></IconBase>,
            Minus: (p) => <IconBase {...p}><line x1="5" y1="12" x2="19" y2="12" /></IconBase>,
            User: (p) => <IconBase {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></IconBase>,
            Save: (p) => <IconBase {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></IconBase>,
            X: (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>,
            Edit2: (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" /></IconBase>,
            Trash2: (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></IconBase>,
            ChevronRight: (p) => <IconBase {...p}><polyline points="9 18 15 12 9 6" /></IconBase>,
            ChevronLeft: (p) => <IconBase {...p}><polyline points="15 18 9 12 15 6" /></IconBase>,
            Star: (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></IconBase>,
            Droplet: (p) => <IconBase {...p}><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" /></IconBase>,
            Dices: (p) => <IconBase {...p}><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><circle cx="12" cy="12" r="2" /><circle cx="6" cy="6" r="2" /><circle cx="18" cy="18" r="2" /></IconBase>,
            Cloud: (p) => <IconBase {...p}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" /></IconBase>,
            Share: (p) => <IconBase {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></IconBase>,
            LogOut: (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>,
            Users: (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-3-3.87"/><path d="M9 21v-2a4 4 0 0 1 3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><circle cx="19" cy="4" r="3"/></IconBase>,
            AlertTriangle: (p) => <IconBase {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>,
        };

        const PEUPLES = ["Demi-elfe", "Demi-orc", "Elfe haut", "Elfe Sylvain", "Gnome", "Halfelin", "Humain", "Nain", "Mage"];
        const PROFILS = ["Arquebusier", "Barde", "Rôdeur", "Voleur", "Barbare", "Chevalier", "Guerrier", "Ensorceleur", "Forgesort", "Magicien", "Sorcier", "Druide", "Moine", "Prêtre"];

        // --- Écran de sélection/création de Table ---
        const TableSelectionModal = ({ onSelectTable, recentTables, onRemoveRecent, initialError = '' }) => {
            const [mode, setMode] = useState('join');
            const [inputCode, setInputCode] = useState('');
            const [tableName, setTableName] = useState('');
            const [error, setError] = useState(initialError);

            useEffect(() => {
                if (initialError) setError(initialError);
            }, [initialError]);

            const handleJoin = async (e) => {
                e.preventDefault();
                setError('');
                let cleanCode = inputCode.trim();
                if (!cleanCode) {
                    setError('Veuillez entrer un code de table.');
                    return;
                }

                if (cleanCode.toUpperCase() === "COF2-SPLASH") {
                    cleanCode = "COF2-Splash";
                } else {
                    cleanCode = cleanCode.toUpperCase();
                }

                const res = await onSelectTable(cleanCode, '', false);
                if (res && !res.success) {
                    setError(res.error);
                }
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                setError('');
                const cleanName = tableName.trim();
                if (!cleanName) {
                    setError('Veuillez donner un nom à votre table.');
                    return;
                }
                const newCode = generateTableCode();
                await onSelectTable(newCode, cleanName, true);
            };

            return (
                <div className="fixed inset-0 bg-black/95 z-50 overflow-y-auto p-4 flex items-center justify-center animate-fade-in">
                    <div className="max-w-md w-full bg-gray-800 rounded-2xl p-6 shadow-2xl border border-gray-700">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3 border border-blue-500/30">
                                <Icons.Shield size={36} />
                            </div>
                            <h1 className="text-2xl font-bold text-white">Suivi COF2</h1>
                            <p className="text-gray-400 text-sm mt-1">Gestionnaire de tables de jeu de rôle</p>
                        </div>

                        <div className="flex bg-gray-900 p-1 rounded-xl mb-6 border border-gray-700">
                            <button
                                onClick={() => { setMode('join'); setError(''); }}
                                className={`flex-1 py-2.5 rounded-lg font-medium text-sm transition-all ${mode === 'join' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                                Rejoindre une table
                            </button>
                            <button
                                onClick={() => { setMode('create'); setError(''); }}
                                className={`flex-1 py-2.5 rounded-lg font-medium text-sm transition-all ${mode === 'create' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                                Créer une table
                            </button>
                        </div>

                        {error && (
                            <div className="mb-4 p-3 bg-red-900/40 border border-red-500/50 rounded-lg text-red-200 text-xs text-center">
                                {error}
                            </div>
                        )}

                        {mode === 'join' ? (
                            <form onSubmit={handleJoin} className="space-y-4">
                                <div>
                                    <label className="block text-xs text-gray-400 mb-1 font-medium">Code d'accès de la table</label>
                                    <input
                                        type="text"
                                        maxLength={15}
                                        value={inputCode}
                                        onChange={(e) => setInputCode(e.target.value)}
                                        placeholder="Ex: AB34X ou COF2-Splash"
                                        autoCapitalize="characters"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3.5 text-center text-xl font-mono text-white tracking-widest focus:border-blue-500 focus:outline-none uppercase placeholder:text-gray-600 placeholder:tracking-normal placeholder:text-sm"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-xl font-bold shadow-lg transition-all"
                                >
                                    Accéder à la table
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleCreate} className="space-y-4">
                                <div>
                                    <label className="block text-xs text-gray-400 mb-1 font-medium">Nom de la table de jeu</label>
                                    <input
                                        type="text"
                                        value={tableName}
                                        onChange={(e) => setTableName(e.target.value)}
                                        placeholder="Ex: La Vengeance des Dragons"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3.5 text-white focus:border-blue-500 focus:outline-none placeholder:text-gray-600"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="w-full py-3.5 bg-green-600 hover:bg-green-500 active:scale-95 text-white rounded-xl font-bold shadow-lg transition-all flex justify-center items-center gap-2"
                                >
                                    <Icons.Plus size={20} /> Créer et Obtenir le code
                                </button>
                            </form>
                        )}

                        {recentTables.length > 0 && (
                            <div className="mt-8 pt-6 border-t border-gray-700/60">
                                <h3 className="text-xs uppercase font-bold text-gray-400 mb-3 flex items-center gap-1.5">
                                    <Icons.Users size={14} /> Dernières tables visitées
                                </h3>
                                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                    {recentTables.map((tbl) => (
                                        <div
                                            key={tbl.code}
                                            onClick={() => onSelectTable(tbl.code, tbl.name, false)}
                                            className="w-full bg-gray-900/80 hover:bg-gray-700 p-3 rounded-xl border border-gray-700/80 flex justify-between items-center text-left transition-colors cursor-pointer group active:scale-[0.98]"
                                        >
                                            <div className="min-w-0 flex-1 pr-2">
                                                <div className="font-bold text-white text-sm truncate">{tbl.name}</div>
                                                <div className="text-xs text-blue-400 font-mono">Code: {tbl.code}</div>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    onRemoveRecent(tbl.code);
                                                }}
                                                className="p-1.5 text-gray-500 hover:text-red-400 rounded-lg hover:bg-gray-800 transition-colors"
                                                title="Retirer de l'historique"
                                            >
                                                <Icons.X size={16} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Composant : Formulaire ---
        const CharacterForm = ({ character, avatarsList, onSave, onCancel, isSaving }) => {
            const [formData, setFormData] = useState(character || {
                id: null, name: '', race: PEUPLES[6], class: PROFILS[6], sex: 'M', color: '#3b82f6', 
                avatar: '', level: 1, hpCurrent: 20, hpMax: 20, initMod: 0, def: 10, luckPoints: 0, recoveryDice: 0, manaPoints: 0, notes: '' 
            });

            const handleChange = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'number' ? Number(value) : value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const submission = { ...formData, id: formData.id || crypto.randomUUID(), hpCurrent: (!character) ? formData.hpMax : formData.hpCurrent };
                onSave(submission);
            };

            return (
                <div className="fixed inset-0 bg-black/95 z-50 overflow-y-auto p-4 animate-fade-in pb-32">
                    <div className="max-w-lg mx-auto bg-gray-800 rounded-xl p-4 shadow-2xl border border-gray-700">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-white">{character ? "Modifier" : "Nouveau"}</h2>
                            <button onClick={onCancel} className="p-2 hover:bg-gray-700 rounded-full text-gray-400 hover:text-white transition-colors">
                                <Icons.X size={24} />
                            </button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 gap-4">
                                <div><label className="block text-sm text-gray-400 mb-1">Nom</label><input required type="text" name="name" value={formData.name} onChange={handleChange} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Ex: Karoom" /></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><label className="block text-sm text-gray-400 mb-1">Peuple</label><select name="race" value={formData.race} onChange={handleChange} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">{PEUPLES.map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                                    <div><label className="block text-sm text-gray-400 mb-1">Profil</label><select name="class" value={formData.class} onChange={handleChange} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">{PROFILS.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-400 mb-1">Avatar / Image</label>
                                    <select name="avatar" value={formData.avatar || ''} onChange={handleChange} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                                        {avatarsList.map((av, idx) => <option key={idx} value={av.url}>{av.name}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="p-4 bg-gray-900 rounded-lg border border-gray-700">
                                <div className="grid grid-cols-3 gap-3 mb-4">
                                    <div><label className="block text-xs text-center mb-1 text-red-400">PV Max</label><input type="number" name="hpMax" value={formData.hpMax} onChange={handleChange} className="w-full bg-gray-800 text-center p-2 rounded border border-gray-600 text-white font-bold focus:outline-none focus:border-red-500" /></div>
                                    <div><label className="block text-xs text-center mb-1 text-blue-400">Défense</label><input type="number" name="def" value={formData.def} onChange={handleChange} className="w-full bg-gray-800 text-center p-2 rounded border border-gray-600 text-white font-bold focus:outline-none focus:border-blue-500" /></div>
                                    <div><label className="block text-xs text-center mb-1 text-yellow-400">Init.</label><input type="number" name="initMod" value={formData.initMod} onChange={handleChange} className="w-full bg-gray-800 text-center p-2 rounded border border-gray-600 text-white font-bold focus:outline-none focus:border-yellow-500" /></div>
                                </div>
                                <div className="grid grid-cols-3 gap-3">
                                    <div><label className="block text-xs text-center mb-1 text-green-400">Chance</label><input type="number" name="luckPoints" value={formData.luckPoints || 0} onChange={handleChange} className="w-full bg-gray-800 text-center p-2 rounded border border-gray-600 text-white focus:outline-none focus:border-green-500" /></div>
                                    <div><label className="block text-xs text-center mb-1 text-purple-400">Récup.</label><input type="number" name="recoveryDice" value={formData.recoveryDice || 0} onChange={handleChange} className="w-full bg-gray-800 text-center p-2 rounded border border-gray-600 text-white focus:outline-none focus:border-purple-500" /></div>
                                    <div><label className="block text-xs text-center mb-1 text-blue-300">Mana</label><input type="number" name="manaPoints" value={formData.manaPoints || 0} onChange={handleChange} className="w-full bg-gray-800 text-center p-2 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-300" /></div>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div><label className="block text-sm text-gray-400 mb-1">Sexe</label><input type="text" name="sex" value={formData.sex || ''} onChange={handleChange} list="sex-options" className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 text-center" placeholder="M/F" /><datalist id="sex-options"><option value="F" /><option value="M" /><option value="NB" /></datalist></div>
                                <div><label className="block text-sm text-gray-400 mb-1">Niveau</label><input type="number" name="level" value={formData.level} onChange={handleChange} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 text-center" /></div>
                                <div><label className="block text-sm text-gray-400 mb-1">Couleur</label><div className="flex items-center h-[50px] bg-gray-900 rounded-lg border border-gray-700 px-1"><input type="color" name="color" value={formData.color} onChange={handleChange} className="w-full h-full bg-transparent cursor-pointer border-none p-0 rounded" /></div></div>
                            </div>
                            <div><label className="block text-sm text-gray-400 mb-1">Notes</label><textarea name="notes" value={formData.notes} onChange={handleChange} rows="3" className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-blue-500"></textarea></div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onCancel} disabled={isSaving} className="flex-1 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium text-white transition-colors">Annuler</button>
                                <button type="submit" disabled={isSaving} className="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-white shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95">{isSaving ? <span className="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"/> : <><Icons.Save size={20} /> Sauvegarder</>}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- Composant : Carte ---
        const CharacterCard = ({ char, onUpdateHP, onViewDetail }) => {
            const hpPercent = Math.max(0, Math.min(100, (char.hpCurrent / char.hpMax) * 100));
            let hpColor = "bg-green-500";
            if (hpPercent < 50) hpColor = "bg-yellow-500";
            if (hpPercent < 20) hpColor = "bg-red-600";
            if (char.hpCurrent <= 0) hpColor = "bg-gray-600";

            return (
                <div className="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700 flex flex-col relative group active:border-gray-500 transition-colors">
                    <div className="h-2 w-full" style={{ backgroundColor: char.color }}></div>
                    <div className="p-4 flex-1 cursor-pointer" onClick={() => onViewDetail(char)}>
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-3 overflow-hidden mr-2">
                                {char.avatar ? (
                                    <img src={char.avatar} alt={char.name} className="w-12 h-12 rounded-full object-cover border border-gray-600 flex-shrink-0" />
                                ) : (
                                    <div className="w-12 h-12 rounded-full flex items-center justify-center font-bold text-xs text-white/50 flex-shrink-0 border border-gray-600" style={{ backgroundColor: char.color }}>
                                        {char.name ? char.name.substring(0, 2).toUpperCase() : "??"}
                                    </div>
                                )}
                                <div className="min-w-0 flex-1">
                                    <h3 className="text-xl font-bold text-white truncate">{char.name}</h3>
                                    <p className="text-gray-400 text-sm truncate">{char.race} {char.class} <span className="text-gray-600">•</span> Niv {char.level}</p>
                                    <div className="mt-1">
                                        <span className={`text-sm font-bold ${char.hpCurrent <= 0 ? "text-red-500" : "text-white"}`}>
                                            {char.hpCurrent} <span className="text-gray-500 text-xs font-normal">/ {char.hpMax} PV</span>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-right min-w-[60px]">

        // --- Composant : Détail ---
        const CharacterDetail = ({ char, onClose, onEdit, onDelete, onUpdateStat }) => {
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            if (!char) return null;
            const ResourceControl = ({ label, icon: Icon, value, field, colorClass }) => (

            return (
                <div className="fixed inset-0 bg-black z-40 overflow-y-auto animate-fade-in">
                    {showDeleteConfirm && (

                    <div className="sticky top-0 bg-gray-900/90 backdrop-blur-sm border-b border-gray-800 p-4 flex justify-between items-center z-50">

                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow-lg"><Icons.Zap className="text-yellow-400 mx-auto mb-2" size={28} /><span className="text-2xl font-bold text-white">{char.initMod >= 0 ? `+${char.initMod}` : char.initMod}</span></div>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow-lg"><Icons.Activity className="text-red-400 mx-auto mb-2" size={28} /><span className="text-2xl font-bold text-white">{char.hpCurrent}</span></div>
                        </div>
                        <div className="bg-gray-800 rounded-xl p-5 mb-6 border border-gray-700 shadow-md">
                            <h3 className="text-gray-400 uppercase text-sm font-bold mb-4 flex items-center gap-2"><Icons.Star size={16} /> Ressources</h3>
                            <ResourceControl label="P. Chance" icon={Icons.Star} value={char.luckPoints} field="luckPoints" colorClass="text-green-400" />
                            <ResourceControl label="Dés Récup." icon={Icons.Dices} value={char.recoveryDice} field="recoveryDice" colorClass="text-purple-400" />
                            <ResourceControl label="P. Mana" icon={Icons.Droplet} value={char.manaPoints} field="manaPoints" colorClass="text-blue-400" />
                        </div>
                        <div className="bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-md">
                            <h3 className="text-gray-400 uppercase text-sm font-bold mb-4">Notes</h3>

                        </div>
                    </div>
                </div>
            );
        };

        // --- Composant : Vue MJ ---
        const DMView = ({ characters, onClose, onDeleteTable, tableName }) => {
            const [showDeleteTableModal, setShowDeleteTableModal] = useState(false);
            const [isDeleting, setIsDeleting] = useState(false);

            const confirmDeleteTable = async () => {
                setIsDeleting(true);
                await onDeleteTable();
            };

            return (
                <div className="fixed inset-0 bg-black z-40 overflow-y-auto animate-fade-in">
                    {showDeleteTableModal && (
                        <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                            <div className="bg-gray-800 border border-red-500/50 p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
                                <div className="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/30">
                                    <Icons.AlertTriangle className="text-red-500" size={32} />
                                </div>
                                <h3 className="text-xl font-bold text-white mb-2">Supprimer toute la table ?</h3>
                                <p className="text-gray-300 font-semibold mb-1">« {tableName} »</p>
                                <p className="text-red-400 text-xs mb-6">Attention : Tous les personnages et données de cette table seront définitivement supprimés dans Firebase.</p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowDeleteTableModal(false)} 
                                        disabled={isDeleting}
                                        className="flex-1 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-medium transition-colors"
                                    >
                                        Annuler
                                    </button>
                                    <button 
                                        onClick={confirmDeleteTable} 
                                        disabled={isDeleting}
                                        className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold transition-colors flex justify-center items-center gap-2"
                                    >
                                        {isDeleting ? <span className="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"/> : 'Supprimer'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="sticky top-0 bg-gray-900/90 backdrop-blur-sm border-b border-gray-800 p-4 flex items-center justify-between z-50">
                        <div className="flex items-center">
                            <button onClick={onClose} className="text-white flex items-center gap-1 pr-4 py-2"><Icons.ChevronLeft /> Retour</button>
                            <h2 className="text-xl font-bold text-white ml-2">Vue MJ</h2>
                        </div>
                        <button
                            onClick={() => setShowDeleteTableModal(true)}
                            className="px-3 py-1.5 bg-red-900/30 hover:bg-red-900/60 text-red-400 border border-red-700/50 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95"
                        >
                            <Icons.Trash2 size={16} /> Supprimer la table
                        </button>
                    </div>

                    <div className="p-4 pb-24 max-w-4xl mx-auto">
                        <div className="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700">
                            <table className="w-full text-left text-gray-300">
                                <thead className="text-xs text-gray-400 uppercase bg-gray-900/50">
                                    <tr>
                                        <th className="px-4 py-3">Joueur</th>
                                        <th className="px-3 py-3 text-center">DEF</th>
                                        <th className="px-3 py-3 text-center">INIT</th>
                                        <th className="px-4 py-3 text-center">PV</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-700">
                                    {characters.map(char => (
                                        <tr key={char.id} className="bg-gray-800 hover:bg-gray-700/50">
                                            <td className="px-4 py-3 flex items-center gap-2.5">
                                                {char.avatar ? (
                                                    <img src={char.avatar} alt={char.name} className="w-8 h-8 rounded-full object-cover border border-gray-600 flex-shrink-0" />
                                                ) : (
                                                    <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: char.color }}></span>
                                                )}
                                                <div className="flex flex-col min-w-0">
                                                    <span className="font-bold text-sm truncate">{char.name}</span>
                                                    <span className="text-gray-500 text-xs truncate">{char.class}</span>
                                                </div>
                                            </td>
                                            <td className="px-3 py-3 text-center text-blue-400 font-mono font-bold text-sm">{char.def}</td>
                                            <td className="px-3 py-3 text-center text-yellow-400 font-mono font-bold text-sm">{char.initMod >= 0 ? `+${char.initMod}` : char.initMod}</td>
                                            <td className="px-4 py-3 text-center text-sm">
                                                <span className={char.hpCurrent <= 0 ? "text-red-500 font-bold" : "text-white font-bold"}>{char.hpCurrent}</span>
                                                <span className="text-gray-500 text-xs"> / {char.hpMax}</span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Composant Principal ---
        const App = () => {
            const [tableCode, setTableCode] = useState(null);
            const [tableName, setTableName] = useState('');
            const [recentTables, setRecentTables] = useState([]);
            const [initialModalError, setInitialModalError] = useState('');

            const [characters, setCharacters] = useState([]);
            const [avatarsList, setAvatarsList] = useState([{ name: "Aucun avatar", url: "" }]);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('list'); 
            const [selectedCharId, setSelectedCharId] = useState(null);
            const selectedChar = characters.find(c => c.id === selectedCharId);
            const [isSaving, setIsSaving] = useState(false);
            const [copied, setCopied] = useState(false);

            const fetchOrSaveTableName = async (code, defaultName) => {
                try {
                    const docRef = db.collection("tables").doc(code);
                    const docSnap = await docRef.get();
                    if (docSnap.exists) {
                        return docSnap.data().name || `Table ${code}`;
                    } else if (defaultName || code === "COF2-Splash") {
                        const nameToUse = defaultName || "Table Principale (Splash)";
                        await docRef.set({ name: nameToUse, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                        return nameToUse;
                    } else {
                        return null;
                    }
                } catch (err) {
                    console.error("Erreur meta table :", err);
                    return null;
                }
            };

            const selectTable = async (code, nameHint = '', isCreation = false) => {
                setLoading(true);
                
                let realCode = code.trim();
                if (realCode.toUpperCase() === "COF2-SPLASH") {
                    realCode = "COF2-Splash";
                }

                const defaultName = isCreation ? (nameHint || `Table ${realCode}`) : null;
                const finalName = await fetchOrSaveTableName(realCode, defaultName);

                if (!finalName) {
                    setLoading(false);
                    return { success: false, error: "Cette table n'existe pas. Vérifiez le code ou créez-en une nouvelle." };
                }

                setTableCode(realCode);
                setTableName(finalName);

                localStorage.setItem('cof2_current_table_code', realCode);
                localStorage.setItem('cof2_current_table_name', finalName);

                setRecentTables(prev => {
                    const filtered = prev.filter(t => t.code !== realCode);
                    const updated = [{ code: realCode, name: finalName }, ...filtered].slice(0, 5);
                    localStorage.setItem('cof2_recent_tables', JSON.stringify(updated));
                    return updated;
                });

                return { success: true };
            };

            useEffect(() => {
                const initApp = async () => {
                    const storedRecents = JSON.parse(localStorage.getItem('cof2_recent_tables') || '[]');
                    setRecentTables(storedRecents);

                    const urlParams = new URLSearchParams(window.location.search);
                    const tableFromUrl = urlParams.get('table');

                    if (tableFromUrl) {
                        let cleanCode = tableFromUrl.trim();
                        if (cleanCode.toUpperCase() === "COF2-SPLASH") cleanCode = "COF2-Splash";
                        else cleanCode = cleanCode.toUpperCase();

                        const res = await selectTable(cleanCode, '', false);
                        if (res && !res.success) {
                            setInitialModalError(`La table "${cleanCode}" spécifiée dans le lien n'existe pas.`);
                            setLoading(false);
                        }
                    } else {
                        const lastCode = localStorage.getItem('cof2_current_table_code');
                        const lastName = localStorage.getItem('cof2_current_table_name');
                        if (lastCode) {
                            const res = await selectTable(lastCode, lastName, false);
                            if (res && !res.success) {
                                localStorage.removeItem('cof2_current_table_code');
                                localStorage.removeItem('cof2_current_table_name');
                                setLoading(false);
                            }
                        } else {
                            setLoading(false);
                        }
                    }
                };

                initApp();
            }, []);

            const handleRemoveRecent = (codeToRemove) => {
                const updated = recentTables.filter(t => t.code !== codeToRemove);
                setRecentTables(updated);
                localStorage.setItem('cof2_recent_tables', JSON.stringify(updated));
            };

            const handleLeaveTable = () => {
                localStorage.removeItem('cof2_current_table_code');
                localStorage.removeItem('cof2_current_table_name');
                setTableCode(null);
                setTableName('');
                setInitialModalError('');
                if (window.location.search) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            };

            const handleDeleteTable = async () => {
                if (!tableCode) return;
                try {
                    // 1. Suppression de tous les personnages sous la table
                    const charsSnapshot = await db.collection("tables").doc(tableCode).collection("characters").get();
                    const batch = db.batch();
                    charsSnapshot.docs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    await batch.commit();

                    // 2. Suppression de la fiche parent de la table
                    await db.collection("tables").doc(tableCode).delete();

                    // 3. Retrait de l'historique et retour accueil
                    handleRemoveRecent(tableCode);
                    handleLeaveTable();
                    setView('list');
                } catch (err) {
                    console.error("Erreur lors de la suppression de la table :", err);
                }
            };

            const handleShare = () => {
                const shareUrl = `${window.location.origin}${window.location.pathname}?table=${tableCode}`;
                if (navigator.share) {
                    navigator.share({
                        title: `Table COF2 : ${tableName}`,
                        text: `Rejoins ma table COF2 "${tableName}" (Code : ${tableCode})`,
                        url: shareUrl,
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(shareUrl);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            useEffect(() => {
                const fetchAvatarsFromGitHub = async () => {
                    try {
                        let repoPath = GITHUB_REPO;
                        if (window.location.hostname.endsWith('.github.io')) {
                            const user = window.location.hostname.split('.')[0];
                            const repo = window.location.pathname.split('/')[1];
                            if (user && repo) repoPath = `${user}/${repo}`;
                        }

                        const res = await fetch(`https://api.github.com/repos/${repoPath}/contents/avatars`);
                        if (res.ok) {
                            const files = await res.json();
                            const imageFiles = files
                                .filter(f => f.type === 'file' && /\.(png|jpe?g|webp|svg|gif)$/i.test(f.name))
                                .map(f => {
                                    const cleanName = f.name
                                        .replace(/\.[^/.]+$/, "")
                                        .replace(/_/g, " ")
                                        .replace(/-/g, " ");
                                    const formattedName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                                    return { name: formattedName, url: `avatars/${f.name}` };
                                });

                            setAvatarsList([{ name: "Aucun avatar", url: "" }, ...imageFiles]);
                        }
                    } catch (err) {
                        console.error("Impossible de récupérer la liste des avatars :", err);
                    }
                };

                fetchAvatarsFromGitHub();
            }, []);

            useEffect(() => {
                if (!tableCode) return;

                setLoading(true);
                const charsRef = db.collection("tables").doc(tableCode).collection("characters");

                const unsubscribe = charsRef.onSnapshot((snapshot) => {
                    const chars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    chars.sort((a, b) => (b.initMod || 0) - (a.initMod || 0) || a.name.localeCompare(b.name));
                    setCharacters(chars);
                    setLoading(false);
                }, (error) => {
                    console.error("Erreur Firestore :", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [tableCode]);

            const charsRef = useMemo(() => {
                if (!tableCode) return null;
                return db.collection("tables").doc(tableCode).collection("characters");
            }, [tableCode]);

            const handleSave = async (data) => {
                if (!charsRef) return;
                setIsSaving(true);
                try {
                    await charsRef.doc(data.id).set(data, { merge: true });
                    setView('list');
                } catch (err) {
                    console.error("Erreur de sauvegarde :", err);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDelete = async (id) => {
                if (!charsRef) return;
                try {
                    await charsRef.doc(id).delete();
                    if (selectedCharId === id) setSelectedCharId(null);
                    setView('list');
                } catch (err) {
                    console.error("Erreur de suppression :", err);
                }
            };

            const handleUpdateHP = async (char, delta) => {
                if (!charsRef) return;
                const newHp = Math.max(0, Math.min(char.hpMax, char.hpCurrent + delta));
                try {
                    await charsRef.doc(char.id).update({ hpCurrent: newHp });
                } catch (err) {
                    console.error("Erreur mise à jour PV :", err);
                }
            };

            const handleUpdateStat = async (char, field, delta) => {
                if (!charsRef) return;
                const currentVal = char[field] || 0;
                const newVal = Math.max(0, currentVal + delta);
                try {
                    await charsRef.doc(char.id).update({ [field]: newVal });
                } catch (err) {
                    console.error("Erreur mise à jour stat :", err);
                }
            };

            if (!tableCode) {
                return (
                    <TableSelectionModal
                        onSelectTable={selectTable}
                        recentTables={recentTables}
                        onRemoveRecent={handleRemoveRecent}
                        initialError={initialModalError}
                    />
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="loading-spinner"></div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-gray-900 border-b border-gray-800 p-3 sticky top-0 z-30 shadow-lg">
                        <div className="max-w-5xl mx-auto flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-2 min-w-0">
                                    <Icons.Shield className="text-blue-500 flex-shrink-0" size={20} />
                                    <div className="min-w-0">
                                        <h1 className="text-base font-bold text-white truncate leading-tight">{tableName}</h1>
                                        <div className="flex items-center gap-2 text-xs text-gray-400">
                                            <span>Code: <strong className="text-blue-400 font-mono">{tableCode}</strong></span>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 flex-shrink-0">
                                    <button
                                        onClick={handleShare}
                                        className="p-2 bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 rounded-lg border border-gray-700 text-xs font-medium transition-all relative"
                                        title="Partager le lien de la table"
                                    >
                                        <Icons.Share size={16} />
                                        {copied && (
                                            <span className="absolute -bottom-8 right-0 bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded shadow whitespace-nowrap">
                                                Lien copié !
                                            </span>
                                        )}
                                    </button>
                                    <button
                                        onClick={handleLeaveTable}
                                        className="p-2 bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-300 rounded-lg border border-gray-700 text-xs transition-colors"
                                        title="Changer de table"
                                    >
                                        <Icons.LogOut size={16} />
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-2 pt-1 border-t border-gray-800/80">
                                <button
                                    onClick={() => setView(view === 'dm' ? 'list' : 'dm')}
                                    className="flex-1 py-1.5 bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 rounded-lg border border-gray-700 text-xs font-medium transition-colors text-center"
                                >
                                    {view === 'dm' ? 'Vue Joueurs' : 'Vue MJ'}
                                </button>
                                <button
                                    onClick={() => { setSelectedCharId(null); setView('form'); }}
                                    className="flex-1 py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1 shadow transition-all"
                                >
                                    <Icons.Plus size={16} /> Nouveau
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="p-4 max-w-5xl mx-auto">
                        {characters.length === 0 ? (
                            <div className="text-center py-20 text-gray-500">
                                <Icons.User size={48} className="mx-auto mb-3 opacity-30" />
                                <p className="text-lg">Aucun personnage dans cette table.</p>
                                <p className="text-sm text-gray-600">Clique sur « Nouveau » pour commencer.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {characters.map(char => (
                                    <CharacterCard
                                        key={char.id}
                                        char={char}
                                        onUpdateHP={handleUpdateHP}
                                        onViewDetail={(c) => { setSelectedCharId(c.id); setView('detail'); }}
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    {view === 'form' && (
                        <CharacterForm
                            character={selectedChar}
                            avatarsList={avatarsList}
                            onSave={handleSave}
                            onCancel={() => setView('list')}
                            isSaving={isSaving}
                        />
                    )}

                    {view === 'detail' && selectedChar && (
                        <CharacterDetail
                            char={selectedChar}
                            onClose={() => setView('list')}
                            onEdit={(c) => { setSelectedCharId(c.id); setView('form'); }}
                            onDelete={handleDelete}
                            onUpdateStat={handleUpdateStat}
                        />
                    )}

                    {view === 'dm' && (
                        <DMView
                            characters={characters}
                            onClose={() => setView('list')}
                            onDeleteTable={handleDeleteTable}
                            tableName={tableName}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
